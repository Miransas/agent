[project]
name = "miransas-voice-agent"
version = "0.1.0"
description = "Miransas Voice Agent backend — LLaMA-3.1 8B"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.28",
  "faster-whisper>=1.2.1",
  "python-multipart>=0.0.32",
  "onnxruntime>=1.29.0",
]

[dependency-groups]
dev = [
  "ruff>=0.9",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
