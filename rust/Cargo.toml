[package]
name = "miralas_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "miralas_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
futures = "0.3"
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
