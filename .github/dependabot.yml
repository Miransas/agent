version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    assignees:
      - "sardorazimov"
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
